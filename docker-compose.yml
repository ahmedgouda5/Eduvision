services:
  eduvision:
    depends_on:
      db-eduvision:
        condition: service_healthy
    container_name: eduvision
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    volumes:
      - ./src:/app/src
      - ./dist:/app/dist
    command: sh -c "npm run db:push && npm run dev"

  db-eduvision:
    image: postgres:17-alpine
    container_name: db-eduvision
    volumes:
      - postgres-db:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=eduvision
      - POSTGRES_PASSWORD=Ahmed@123
      - POSTGRES_DB=eduvision
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduvision -d eduvision"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  postgres-db:
